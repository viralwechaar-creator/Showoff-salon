name: Diagnose API Routing

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Curl /api/site (known working)
        run: curl -sS -i https://showoff-salon.vercel.app/api/site | head -40

      - name: Curl /api/uploads/test (known broken)
        run: curl -sS -i https://showoff-salon.vercel.app/api/uploads/test | head -40

      - name: Curl /api/admin/me (2 segments, GET, no auth needed)
        run: curl -sS -i https://showoff-salon.vercel.app/api/admin/me | head -40

      - name: Curl /api/slots (1 segment)
        run: curl -sS -i "https://showoff-salon.vercel.app/api/slots?date=2026-09-25" | head -40
