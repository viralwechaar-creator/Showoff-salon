name: Fix Booking Conflict

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch booking code
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("api/[...path].js")
          s = p.read_text()

          old = """async function writeJsonBlob(key, data, etag) {
            const { put } = await blob();
            try {
              await put(key, JSON.stringify(data), Object.assign(
                { access: 'private', contentType: 'application/json', addRandomSuffix: false },
                etag ? { allowOverwrite: true, ifMatch: etag } : { allowOverwrite: false }
              ));
            } catch (e) { if (isConflict(e)) throw conflictErr(); throw e; }
          }"""

          new = """async function writeJsonBlob(key, data, etag, forceOverwrite = false) {
            const { put } = await blob();
            try {
              const options = {
                access: 'private',
                contentType: 'application/json',
                addRandomSuffix: false
              };

              if (forceOverwrite) {
                options.allowOverwrite = true;
              } else if (etag) {
                options.allowOverwrite = true;
                options.ifMatch = etag;
              } else {
                options.allowOverwrite = false;
              }

              await put(key, JSON.stringify(data), options);
            } catch (e) {
              if (isConflict(e)) throw conflictErr();
              throw e;
            }
          }"""

          if old not in s:
              raise SystemExit("writeJsonBlob function not found")

          s = s.replace(old, new, 1)

          old = """async function save() { const c = ctx(); await writeJsonBlob(DB_KEY, c.db, c.etag); }"""

          new = """async function save(forceOverwrite = false) {
            const c = ctx();
            await writeJsonBlob(DB_KEY, c.db, c.etag, forceOverwrite);
          }"""

          if old not in s:
              raise SystemExit("save function not found")

          s = s.replace(old, new, 1)

          old = """  db.bookings.push(rec);
  await save();
  return rec;"""

          new = """  db.bookings.push(rec);
  await save(true);
  return rec;"""

          if old not in s:
              raise SystemExit("booking save block not found")

          s = s.replace(old, new, 1)

          p.write_text(s)
          print("PATCH SUCCESS")

          PY

      - name: Check file
        run: |
          grep -n "forceOverwrite" "api/[...path].js"
          grep -n "db.bookings.push(rec)" "api/[...path].js"

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "api/[...path].js"
          git commit -m "Fix booking save conflict" || echo "No changes"
          git push
