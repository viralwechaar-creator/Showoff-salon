name: Fix Booking Conflict

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Patch API
        run: python3 fix_booking.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/[...path].js
          git commit -m "Fix booking conflict" || true
          git push
