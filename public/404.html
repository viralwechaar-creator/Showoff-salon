<style>
  .nf { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; text-align: center; padding: 24px; }

  .nf h1 { font-size: clamp(32px, 6vw, 48px); }
  .nf p { color: var(--muted); }
  .nf-links { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
</style>

<body>
<main class="nf">
  <div class="nf-in">
    <img src="/assets/logo-plum.png" alt="">
    <h1>Page not found</h1>
    <p>That page doesn't exist, or may have moved.</p>
    <div class="nf-links">
      <a class="btn" href="/">Go home</a>
      <a class="btn btn-alt" href="/menu">See the menu</a>
    </div>
  </div>
</main>
